# 2. Define your repetitive matrix expansions!
[[matrix]]
type = "Letter"
colors = [
    { name = "Purple", code = "pr" },
    { name = "Black", code = "bk" },
    { name = "Turquoise", code = "tq" },
    { name = "Magenta", code = "mg" },
    { name = "Dark Blue", code = "db" },
    { name = "Pink", code = "pn" },
    { name = "Generic", code = "gn" },
]
# Simply tell Rust to generate all letters from A to Z for these colors
range_start = "A"
range_end = "Z"

# 4. Define your repetitive matrix expansions!
[[matrix]]
type = "Number"
colors = [
    { name = "Purple", code = "pr" },
    { name = "Black", code = "bk" },
    { name = "Turquoise", code = "tq" },
    { name = "Magenta", code = "mg" },
    { name = "Dark Blue", code = "db" },
    { name = "Pink", code = "pn" },
    { name = "Generic", code = "gn" },
]
# Simply tell Rust to generate all numbers from 0 to 9 for these colors
range_start = 0
range_end = 9


[[matrix]]
type = "Base"
colors = [
    { name = "Purple", code = "pr" },
    { name = "Turquoise", code = "tq" },
    { name = "Magenta", code = "mg" },
    { name = "Dark Blue", code = "db" },
    { name = "Pink", code = "pn" },
    { name = "Purple", code = "lp" },
    { name = "Yellow", code = "y" },
    { name = "Black", code = "bk" },
    { name = "Generic", code = "gn" },
]
# Expand sizes 3 through 7 automatically
size_start = 3
size_end = 7
